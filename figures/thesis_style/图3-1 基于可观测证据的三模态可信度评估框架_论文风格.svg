<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
    <style>
      .box{fill:#fff;stroke:#222;stroke-width:1.2}.soft{fill:#f2f6fb;stroke:#4f7fbf;stroke-width:1.1}.group{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 5}.line{stroke:#222;stroke-width:1.2;fill:none;marker-end:url(#arrow)}
      .title{font-family:"SimSun","Microsoft YaHei",Arial,sans-serif;font-size:18px;font-weight:bold;fill:#111}.txt{font-family:"SimSun","Microsoft YaHei",Arial,sans-serif;font-size:15px;fill:#111}.small{font-family:"SimSun","Microsoft YaHei",Arial,sans-serif;font-size:13px;fill:#222}.cap{font-family:"Times New Roman","SimSun",serif;font-size:14px;fill:#111}
    </style>
  </defs>
  <rect width="900" height="520" fill="#fff"/>
  <text x="450" y="34" text-anchor="middle" class="title">基于可观测证据的三模态可信度评估框架</text>
  <rect x="35" y="86" width="160" height="58" class="box"/><text x="115" y="110" text-anchor="middle" class="txt">API 调用序列</text><text x="115" y="132" text-anchor="middle" class="small">行为序列信息</text>
  <rect x="35" y="215" width="160" height="58" class="box"/><text x="115" y="239" text-anchor="middle" class="txt">程序调用图</text><text x="115" y="261" text-anchor="middle" class="small">结构关系信息</text>
  <rect x="35" y="344" width="160" height="58" class="box"/><text x="115" y="368" text-anchor="middle" class="txt">Manifest 声明</text><text x="115" y="390" text-anchor="middle" class="small">权限与组件信息</text>
  <rect x="245" y="64" width="270" height="360" rx="6" class="group"/><text x="380" y="88" text-anchor="middle" class="txt">可观测证据构建</text>
  <rect x="278" y="112" width="205" height="42" class="soft"/><text x="380" y="138" text-anchor="middle" class="txt">模态可用性 a_m(x)</text>
  <rect x="278" y="176" width="205" height="42" class="soft"/><text x="380" y="202" text-anchor="middle" class="txt">模态完整性 q_m(x)</text>
  <rect x="278" y="240" width="205" height="42" class="soft"/><text x="380" y="266" text-anchor="middle" class="txt">模型可见比例 v_m(x)</text>
  <rect x="278" y="304" width="205" height="42" class="soft"/><text x="380" y="330" text-anchor="middle" class="txt">跨模态支持关系 s_m(x)</text>
  <line x1="195" y1="115" x2="245" y2="170" class="line"/><line x1="195" y1="244" x2="245" y2="244" class="line"/><line x1="195" y1="373" x2="245" y2="318" class="line"/>
  <rect x="570" y="98" width="245" height="65" class="box"/><text x="692" y="123" text-anchor="middle" class="txt">分支整体判别能力</text><text x="692" y="146" text-anchor="middle" class="small">校准集统计得到 C_m</text>
  <rect x="570" y="221" width="245" height="65" class="box"/><text x="692" y="246" text-anchor="middle" class="txt">单调可靠性校准</text><text x="692" y="269" text-anchor="middle" class="small">得到样本级可靠性 R_m(x)</text>
  <rect x="570" y="344" width="245" height="65" class="box"/><text x="692" y="369" text-anchor="middle" class="txt">三模态可信评分</text><text x="692" y="392" text-anchor="middle" class="small">T_api, T_graph, T_man</text>
  <line x1="515" y1="254" x2="570" y2="254" class="line"/><line x1="692" y1="163" x2="692" y2="221" class="line"/><line x1="692" y1="286" x2="692" y2="344" class="line"/>
  <text x="450" y="466" text-anchor="middle" class="cap">图3-1 基于可观测证据的三模态可信度评估框架</text>
  <text x="450" y="490" text-anchor="middle" class="cap">Figure 3-1 Framework of Tri-modal Reliability Assessment Based on Observable Evidence</text>
</svg>
