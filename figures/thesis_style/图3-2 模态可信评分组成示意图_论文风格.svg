<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
    <style>.box{fill:#fff;stroke:#222;stroke-width:1.2}.emph{fill:#f2f6fb;stroke:#4f7fbf;stroke-width:1.1}.line{stroke:#222;stroke-width:1.1;fill:none;marker-end:url(#arrow)}.title{font-family:"SimSun","Microsoft YaHei",Arial,sans-serif;font-size:18px;font-weight:bold}.txt{font-family:"SimSun","Microsoft YaHei",Arial,sans-serif;font-size:15px}.small{font-family:"SimSun","Microsoft YaHei",Arial,sans-serif;font-size:13px}.formula{font-family:"Times New Roman","SimSun",serif;font-size:18px}.cap{font-family:"Times New Roman","SimSun",serif;font-size:14px}</style>
  </defs>
  <rect width="860" height="430" fill="#fff"/><text x="430" y="34" text-anchor="middle" class="title">模态可信评分组成示意图</text>
  <rect x="55" y="80" width="170" height="60" class="box"/><text x="140" y="104" text-anchor="middle" class="txt">分支整体能力</text><text x="140" y="127" text-anchor="middle" class="small">C_m</text>
  <rect x="55" y="170" width="170" height="60" class="box"/><text x="140" y="194" text-anchor="middle" class="txt">样本级可靠性</text><text x="140" y="217" text-anchor="middle" class="small">R_m(x)</text>
  <rect x="55" y="260" width="170" height="60" class="box"/><text x="140" y="284" text-anchor="middle" class="txt">可见性修正</text><text x="140" y="307" text-anchor="middle" class="small">M_m(x)</text>
  <rect x="285" y="170" width="170" height="60" class="box"/><text x="370" y="194" text-anchor="middle" class="txt">模态可用性</text><text x="370" y="217" text-anchor="middle" class="small">a_m(x)</text>
  <rect x="520" y="134" width="255" height="132" class="emph"/><text x="648" y="166" text-anchor="middle" class="txt">乘性组合</text><text x="648" y="202" text-anchor="middle" class="formula">T_m(x)=C_m · R_m(x) · M_m(x) · a_m(x)</text><text x="648" y="236" text-anchor="middle" class="small">任一环节明显不可靠时，最终评分下降</text>
  <line x1="225" y1="110" x2="520" y2="164" class="line"/><line x1="225" y1="200" x2="520" y2="200" class="line"/><line x1="225" y1="290" x2="520" y2="236" class="line"/><line x1="455" y1="200" x2="520" y2="200" class="line"/>
  <text x="430" y="374" text-anchor="middle" class="cap">图3-2 模态可信评分组成示意图</text><text x="430" y="398" text-anchor="middle" class="cap">Figure 3-2 Composition of Modality Reliability Score</text>
</svg>
