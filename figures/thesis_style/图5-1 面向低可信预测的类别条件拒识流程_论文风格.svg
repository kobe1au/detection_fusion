<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540">
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker><style>.box{fill:#fff;stroke:#222;stroke-width:1.2}.soft{fill:#f2f6fb;stroke:#4f7fbf;stroke-width:1.1}.decision{fill:#fff;stroke:#222;stroke-width:1.2}.line{stroke:#222;stroke-width:1.2;fill:none;marker-end:url(#arrow)}.title{font-family:"SimSun","Microsoft YaHei",Arial,sans-serif;font-size:18px;font-weight:bold}.txt{font-family:"SimSun","Microsoft YaHei",Arial,sans-serif;font-size:15px}.small{font-family:"SimSun","Microsoft YaHei",Arial,sans-serif;font-size:13px}.cap{font-family:"Times New Roman","SimSun",serif;font-size:14px}</style></defs>
  <rect width="860" height="540" fill="#fff"/><text x="430" y="34" text-anchor="middle" class="title">面向低可信预测的类别条件拒识流程</text>
  <rect x="80" y="78" width="180" height="58" class="box"/><text x="170" y="102" text-anchor="middle" class="txt">融合类别概率</text><text x="170" y="124" text-anchor="middle" class="small">p_c^f(x)</text>
  <rect x="80" y="185" width="180" height="58" class="box"/><text x="170" y="209" text-anchor="middle" class="txt">原始模态冲突</text><text x="170" y="231" text-anchor="middle" class="small">κ(x)</text>
  <rect x="340" y="128" width="200" height="78" class="soft"/><text x="440" y="157" text-anchor="middle" class="txt">预测不可靠程度</text><text x="440" y="183" text-anchor="middle" class="small">r_c(x)=1-p_c^f(x)+κ(x)</text>
  <rect x="610" y="78" width="180" height="58" class="box"/><text x="700" y="102" text-anchor="middle" class="txt">校准集</text><text x="700" y="124" text-anchor="middle" class="small">按真实类别分组</text>
  <rect x="610" y="185" width="180" height="58" class="box"/><text x="700" y="209" text-anchor="middle" class="txt">类别阈值</text><text x="700" y="231" text-anchor="middle" class="small">τ_0, τ_1</text>
  <rect x="350" y="280" width="180" height="58" class="box"/><text x="440" y="304" text-anchor="middle" class="txt">测试样本预测</text><text x="440" y="326" text-anchor="middle" class="small">得到预测类别</text>
  <polygon points="440,370 530,420 440,470 350,420" class="decision"/><text x="440" y="414" text-anchor="middle" class="txt">r_ŷ(x) ≤ τ_ŷ ?</text><text x="440" y="436" text-anchor="middle" class="small">是否低于对应类别阈值</text>
  <rect x="155" y="398" width="130" height="50" class="soft"/><text x="220" y="428" text-anchor="middle" class="txt">接受预测</text><rect x="600" y="398" width="130" height="50" class="box"/><text x="665" y="428" text-anchor="middle" class="txt">拒识样本</text>
  <line x1="260" y1="107" x2="340" y2="156" class="line"/><line x1="260" y1="214" x2="340" y2="180" class="line"/><line x1="700" y1="136" x2="700" y2="185" class="line"/><line x1="610" y1="214" x2="540" y2="180" class="line"/><line x1="440" y1="206" x2="440" y2="280" class="line"/><line x1="440" y1="338" x2="440" y2="370" class="line"/><line x1="350" y1="420" x2="285" y2="423" class="line"/><line x1="530" y1="420" x2="600" y2="423" class="line"/><text x="316" y="405" text-anchor="middle" class="small">是</text><text x="568" y="405" text-anchor="middle" class="small">否</text>
  <text x="430" y="500" text-anchor="middle" class="cap">图5-1 面向低可信预测的类别条件拒识流程</text><text x="430" y="522" text-anchor="middle" class="cap">Figure 5-1 Workflow of Class-conditional Rejection for Low-confidence Predictions</text>
</svg>
