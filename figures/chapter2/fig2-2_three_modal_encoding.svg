<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 50 1440 650">
  <defs>
    <style>
      .title { font: 600 26px "Microsoft YaHei", "SimHei", sans-serif; fill: #202020; }
      .head { font: 600 23px "Microsoft YaHei", "SimHei", sans-serif; fill: #202020; }
      .body { font: 20px "Microsoft YaHei", "SimSun", sans-serif; fill: #303030; }
      .small { font: 18px "Microsoft YaHei", "SimSun", sans-serif; fill: #404040; }
      .math { font: italic 21px "Cambria Math", serif; fill: #202020; }
      .box { stroke: #303030; stroke-width: 1.8; rx: 8; ry: 8; }
      .line { stroke: #303030; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .lane { stroke: #8b8b8b; stroke-width: 1.2; stroke-dasharray: 7 6; fill: none; rx: 12; ry: 12; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#303030"/>
    </marker>
  </defs>

  <rect x="35" y="70" width="1370" height="175" class="lane"/>
  <rect x="35" y="263" width="1370" height="175" class="lane"/>
  <rect x="35" y="456" width="1370" height="175" class="lane"/>

  <!-- API lane -->
  <rect x="70" y="112" width="210" height="92" class="box" fill="#eef5fb"/>
  <text x="175" y="149" text-anchor="middle" class="head">API调用序列</text>
  <text x="175" y="180" text-anchor="middle" class="small">标识、类型与顺序</text>

  <rect x="365" y="101" width="245" height="114" class="box" fill="#f8fafb"/>
  <text x="487" y="139" text-anchor="middle" class="head">嵌入与位置编码</text>
  <text x="487" y="172" text-anchor="middle" class="small">标识嵌入 + 类型嵌入</text>
  <text x="487" y="199" text-anchor="middle" class="small">+ 正弦余弦位置编码</text>

  <rect x="700" y="112" width="230" height="92" class="box" fill="#eef5fb"/>
  <text x="815" y="149" text-anchor="middle" class="head">Transformer编码器</text>
  <text x="815" y="180" text-anchor="middle" class="small">多头注意力与前馈网络</text>

  <rect x="1030" y="112" width="300" height="92" class="box" fill="#f5f5f5"/>
  <text x="1180" y="149" text-anchor="middle" class="head">API模态表示</text>
  <text x="1180" y="181" text-anchor="middle" class="math">z_api ∈ R^d</text>

  <path d="M280 158 H365" class="line"/><path d="M610 158 H700" class="line"/><path d="M930 158 H1030" class="line"/>

  <!-- Graph lane -->
  <rect x="70" y="305" width="210" height="92" class="box" fill="#eef6ee"/>
  <text x="175" y="342" text-anchor="middle" class="head">程序调用图</text>
  <text x="175" y="373" text-anchor="middle" class="small">节点、边与节点属性</text>

  <rect x="365" y="294" width="245" height="114" class="box" fill="#f8faf8"/>
  <text x="487" y="333" text-anchor="middle" class="head">图结构预处理</text>
  <text x="487" y="366" text-anchor="middle" class="small">节点特征映射</text>
  <text x="487" y="393" text-anchor="middle" class="small">自环与邻接关系构建</text>

  <rect x="700" y="305" width="230" height="92" class="box" fill="#eef6ee"/>
  <text x="815" y="342" text-anchor="middle" class="head">GATv2编码器</text>
  <text x="815" y="373" text-anchor="middle" class="small">邻域注意力与图池化</text>

  <rect x="1030" y="305" width="300" height="92" class="box" fill="#f5f5f5"/>
  <text x="1180" y="342" text-anchor="middle" class="head">调用图模态表示</text>
  <text x="1180" y="374" text-anchor="middle" class="math">z_graph ∈ R^d</text>

  <path d="M280 351 H365" class="line"/><path d="M610 351 H700" class="line"/><path d="M930 351 H1030" class="line"/>

  <!-- Manifest lane -->
  <rect x="70" y="498" width="210" height="92" class="box" fill="#fff6eb"/>
  <text x="175" y="535" text-anchor="middle" class="head">Manifest声明</text>
  <text x="175" y="566" text-anchor="middle" class="small">权限、组件与配置</text>

  <rect x="365" y="487" width="245" height="114" class="box" fill="#fffaf4"/>
  <text x="487" y="526" text-anchor="middle" class="head">特征向量构建</text>
  <text x="487" y="559" text-anchor="middle" class="small">类别嵌入与统计特征</text>
  <text x="487" y="586" text-anchor="middle" class="small">拼接和维度映射</text>

  <rect x="700" y="498" width="230" height="92" class="box" fill="#fff6eb"/>
  <text x="815" y="535" text-anchor="middle" class="head">前馈编码器</text>
  <text x="815" y="566" text-anchor="middle" class="small">全连接层与非线性变换</text>

  <rect x="1030" y="498" width="300" height="92" class="box" fill="#f5f5f5"/>
  <text x="1180" y="535" text-anchor="middle" class="head">Manifest模态表示</text>
  <text x="1180" y="567" text-anchor="middle" class="math">z_man ∈ R^d</text>

  <path d="M280 544 H365" class="line"/><path d="M610 544 H700" class="line"/><path d="M930 544 H1030" class="line"/>
</svg>
