<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="710" viewBox="0 50 1500 710">
  <defs>
    <style>
      .title { font: 600 26px "Microsoft YaHei", "SimHei", sans-serif; fill: #202020; }
      .head { font: 600 22px "Microsoft YaHei", "SimHei", sans-serif; fill: #202020; }
      .body { font: 19px "Microsoft YaHei", "SimSun", sans-serif; fill: #303030; }
      .small { font: 17px "Microsoft YaHei", "SimSun", sans-serif; fill: #404040; }
      .box { stroke: #303030; stroke-width: 1.8; rx: 8; ry: 8; }
      .group { stroke: #777; stroke-width: 1.3; stroke-dasharray: 7 6; fill: none; rx: 12; ry: 12; }
      .line { stroke: #303030; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #555; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#303030"/>
    </marker>
  </defs>

  <rect x="35" y="70" width="285" height="600" class="group"/>
  <text x="177" y="102" text-anchor="middle" class="head">模态特征与分支预测</text>

  <rect x="70" y="145" width="215" height="105" class="box" fill="#eef5fb"/>
  <text x="177" y="184" text-anchor="middle" class="head">API调用序列</text>
  <text x="177" y="218" text-anchor="middle" class="body">编码表示与分支预测</text>
  <rect x="70" y="318" width="215" height="105" class="box" fill="#eef6ee"/>
  <text x="177" y="357" text-anchor="middle" class="head">程序调用图</text>
  <text x="177" y="391" text-anchor="middle" class="body">编码表示与分支预测</text>
  <rect x="70" y="491" width="215" height="105" class="box" fill="#fff6eb"/>
  <text x="177" y="530" text-anchor="middle" class="head">Manifest声明</text>
  <text x="177" y="564" text-anchor="middle" class="body">编码表示与分支预测</text>

  <rect x="385" y="70" width="300" height="600" class="group"/>
  <text x="535" y="102" text-anchor="middle" class="head">模态可信度评估</text>

  <rect x="420" y="145" width="230" height="105" class="box" fill="#fafafa"/>
  <text x="535" y="182" text-anchor="middle" class="head">可观测证据</text>
  <text x="535" y="215" text-anchor="middle" class="small">完整性、可用性与支持关系</text>
  <rect x="420" y="318" width="230" height="105" class="box" fill="#fafafa"/>
  <text x="535" y="355" text-anchor="middle" class="head">可靠性校准</text>
  <text x="535" y="388" text-anchor="middle" class="small">样本级可靠性与能力先验</text>
  <rect x="420" y="491" width="230" height="105" class="box" fill="#fafafa"/>
  <text x="535" y="528" text-anchor="middle" class="head">模态可信评分</text>
  <text x="535" y="561" text-anchor="middle" class="small">确定各模态证据保留程度</text>

  <path d="M285 198 H420" class="thin"/><path d="M285 370 H420" class="thin"/><path d="M285 543 H420" class="thin"/>
  <path d="M535 250 V318" class="line"/><path d="M535 423 V491" class="line"/>

  <rect x="750" y="112" width="270" height="170" class="box" fill="#f3f0fa"/>
  <text x="885" y="153" text-anchor="middle" class="head">可信度约束的证据调整</text>
  <text x="885" y="192" text-anchor="middle" class="body">保留高可信证据</text>
  <text x="885" y="226" text-anchor="middle" class="body">将削弱部分计入不确定性</text>

  <rect x="750" y="358" width="270" height="170" class="box" fill="#f3f0fa"/>
  <text x="885" y="399" text-anchor="middle" class="head">多模态证据组合</text>
  <text x="885" y="438" text-anchor="middle" class="body">累积一致证据</text>
  <text x="885" y="472" text-anchor="middle" class="body">将模态冲突计入不确定性</text>

  <path d="M650 543 H700 V197 H750" class="line"/>
  <path d="M885 282 V358" class="line"/>

  <rect x="1090" y="155" width="245" height="110" class="box" fill="#eef5fb"/>
  <text x="1212" y="195" text-anchor="middle" class="head">融合检测结果</text>
  <text x="1212" y="228" text-anchor="middle" class="body">类别概率与融合不确定性</text>
  <path d="M1020 443 H1055 V210 H1090" class="line"/>

  <rect x="1090" y="370" width="245" height="145" class="box" fill="#fff7e8"/>
  <text x="1212" y="410" text-anchor="middle" class="head">低可信结果识别</text>
  <text x="1212" y="445" text-anchor="middle" class="body">结合融合概率与模态冲突</text>
  <text x="1212" y="479" text-anchor="middle" class="body">判断是否接受检测结果</text>
  <path d="M1212 265 V370" class="line"/>

  <rect x="1380" y="162" width="90" height="82" class="box" fill="#eef6ee"/>
  <text x="1425" y="211" text-anchor="middle" class="head">接受</text>
  <rect x="1380" y="405" width="90" height="82" class="box" fill="#f9eeee"/>
  <text x="1425" y="454" text-anchor="middle" class="head">拒识</text>
  <path d="M1335 410 H1360 V203 H1380" class="line"/>
  <path d="M1335 475 H1380" class="line"/>

  <text x="885" y="694" text-anchor="middle" class="small">高可信证据参与融合；难以一致解释的证据转化为不确定性；低可信结果进入后续复核流程</text>
</svg>
