<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #222222; stroke-width: 1.6; }
      .step { fill: #f5f5f5; stroke: #222222; stroke-width: 1.6; }
      .accept { fill: #f7f7f7; stroke: #222222; stroke-width: 1.6; }
      .arrow { fill: none; stroke: #222222; stroke-width: 1.7; marker-end: url(#arrow); }
      .text { font: 23px "SimSun", "Microsoft YaHei", serif; fill: #111111; }
      .small { font: 20px "SimSun", "Microsoft YaHei", serif; fill: #222222; }
      .math { font: italic 22px "Cambria Math", "Times New Roman", serif; fill: #111111; }
      .condition { font: 22px "Cambria Math", "Times New Roman", serif; fill: #111111; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#222222"/>
    </marker>
  </defs>

  <rect width="1400" height="680" fill="#ffffff"/>

  <!-- Test-sample information -->
  <rect x="45" y="75" width="225" height="78" rx="2" class="box"/>
  <text x="157.5" y="108" text-anchor="middle" class="text">融合概率</text>
  <text x="157.5" y="137" text-anchor="middle" class="math">p<tspan baseline-shift="super" font-size="15">f</tspan>(x)</text>

  <rect x="45" y="205" width="225" height="78" rx="2" class="box"/>
  <text x="157.5" y="238" text-anchor="middle" class="text">组合前冲突</text>
  <text x="157.5" y="267" text-anchor="middle" class="math">κ(x)</text>

  <path d="M270 114 H320 V179 H370" class="arrow"/>
  <path d="M270 244 H320 V179 H370" class="arrow"/>

  <rect x="370" y="130" width="275" height="98" rx="2" class="step"/>
  <text x="507.5" y="171" text-anchor="middle" class="text">类别非一致性评分</text>
  <text x="507.5" y="205" text-anchor="middle" class="math">r<tspan baseline-shift="sub" font-size="15">0</tspan>(x)，r<tspan baseline-shift="sub" font-size="15">1</tspan>(x)</text>

  <!-- Calibration information -->
  <rect x="745" y="55" width="240" height="78" rx="2" class="box"/>
  <text x="865" y="88" text-anchor="middle" class="text">独立校准集</text>
  <text x="865" y="117" text-anchor="middle" class="small">按真实类别分组</text>

  <path d="M865 133 V167" class="arrow"/>
  <rect x="745" y="168" width="240" height="78" rx="2" class="box"/>
  <text x="865" y="201" text-anchor="middle" class="text">类别阈值校准</text>
  <text x="865" y="230" text-anchor="middle" class="math">τ<tspan baseline-shift="sub" font-size="15">0</tspan>，τ<tspan baseline-shift="sub" font-size="15">1</tspan></text>

  <!-- Class-wise tests and prediction set -->
  <path d="M645 179 H690 V316 H790" class="arrow"/>
  <path d="M865 246 V260 H940 V274" class="arrow"/>
  <rect x="790" y="275" width="300" height="82" rx="2" class="step"/>
  <text x="940" y="309" text-anchor="middle" class="text">双类别阈值检验</text>
  <text x="940" y="339" text-anchor="middle" class="small">分别检验良性类和恶意类</text>

  <path d="M940 357 V397" class="arrow"/>
  <rect x="790" y="398" width="300" height="82" rx="2" class="step"/>
  <text x="940" y="432" text-anchor="middle" class="text">构造共形预测集合</text>
  <text x="940" y="462" text-anchor="middle" class="math">Γ(x)</text>

  <!-- Symmetric result branches -->
  <path d="M940 480 V521 H330 V550" class="arrow"/>
  <path d="M940 521 H700 V550" class="arrow"/>
  <path d="M940 521 H1070 V550" class="arrow"/>
  <circle cx="940" cy="521" r="3.4" fill="#222222"/>

  <rect x="205" y="551" width="250" height="96" rx="2" class="accept"/>
  <text x="330" y="584" text-anchor="middle" class="condition">|Γ(x)| = 1</text>
  <text x="330" y="622" text-anchor="middle" class="text">接受分类</text>

  <rect x="575" y="551" width="250" height="96" rx="2" class="box"/>
  <text x="700" y="584" text-anchor="middle" class="condition">|Γ(x)| = 0</text>
  <text x="700" y="622" text-anchor="middle" class="text">拒识</text>

  <rect x="945" y="551" width="250" height="96" rx="2" class="box"/>
  <text x="1070" y="584" text-anchor="middle" class="condition">|Γ(x)| = 2</text>
  <text x="1070" y="622" text-anchor="middle" class="text">拒识</text>
</svg>
