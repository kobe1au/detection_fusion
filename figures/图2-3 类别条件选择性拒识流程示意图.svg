<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif; fill: #222222; }
      .title { font-size: 26px; font-weight: 700; }
      .box-title { font-size: 18px; font-weight: 700; }
      .box-text { font-size: 15px; }
      .small { font-size: 13px; fill: #555555; }
      .box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; rx: 12; }
      .cal { fill: #e9f3ff; stroke: #4f88c6; }
      .score { fill: #f3ecff; stroke: #8560b8; }
      .good { fill: #ecf7ef; stroke: #5a9b69; }
      .bad { fill: #fff0f0; stroke: #c45a5a; }
      .arrow { stroke: #333333; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #888888; stroke-width: 1.3; stroke-dasharray: 7 6; rx: 16; }
    </style>
  </defs>

  <rect x="18" y="18" width="1084" height="604" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="560" y="58" class="title" text-anchor="middle">类别条件选择性拒识流程示意图</text>

  <rect x="45" y="80" width="1030" height="165" class="dash"/>
  <text x="560" y="235" class="small" text-anchor="middle">校准阶段：在校准集上分别估计良性类和恶意类拒识阈值</text>

  <rect x="70" y="110" width="230" height="95" class="box cal"/>
  <text x="185" y="146" class="box-title" text-anchor="middle">校准集样本</text>
  <text x="185" y="176" class="box-text" text-anchor="middle">已知真实标签</text>

  <rect x="410" y="110" width="250" height="95" class="box score"/>
  <text x="535" y="146" class="box-title" text-anchor="middle">计算非一致性分数</text>
  <text x="535" y="176" class="box-text" text-anchor="middle">预测概率与原始模态冲突</text>

  <rect x="770" y="110" width="235" height="95" class="box cal"/>
  <text x="887.5" y="145" class="box-title" text-anchor="middle">学习类别阈值</text>
  <text x="887.5" y="175" class="box-text" text-anchor="middle">良性阈值 q_b，恶意阈值 q_m</text>

  <rect x="45" y="305" width="1030" height="275" class="dash"/>
  <text x="560" y="575" class="small" text-anchor="middle">测试阶段：根据预测类别选择对应阈值，决定接受预测或拒识</text>

  <rect x="70" y="385" width="230" height="95" class="box cal"/>
  <text x="185" y="421" class="box-title" text-anchor="middle">测试样本</text>
  <text x="185" y="451" class="box-text" text-anchor="middle">模型输出预测类别</text>

  <rect x="410" y="385" width="250" height="95" class="box score"/>
  <text x="535" y="421" class="box-title" text-anchor="middle">计算样本分数</text>
  <text x="535" y="451" class="box-text" text-anchor="middle">与预测类别阈值比较</text>

  <rect x="745" y="370" width="180" height="125" class="box score"/>
  <text x="835" y="415" class="box-title" text-anchor="middle">阈值判断</text>
  <text x="835" y="448" class="box-text" text-anchor="middle">s(x) ≤ q_c ?</text>
  <text x="835" y="474" class="small" text-anchor="middle">按预测类别选择阈值</text>

  <rect x="955" y="330" width="130" height="80" class="box good"/>
  <text x="1020" y="363" class="box-title" text-anchor="middle">接受预测</text>
  <text x="1020" y="392" class="box-text" text-anchor="middle">输出类别</text>

  <rect x="955" y="475" width="130" height="80" class="box bad"/>
  <text x="1020" y="508" class="box-title" text-anchor="middle">拒识样本</text>
  <text x="1020" y="537" class="box-text" text-anchor="middle">复核检测</text>

  <path d="M 300 157.5 H 410" class="arrow"/>
  <path d="M 660 157.5 H 770" class="arrow"/>
  <path d="M 887.5 205 V 285 H 835 V 370" class="arrow"/>

  <path d="M 300 432.5 H 410" class="arrow"/>
  <path d="M 660 432.5 H 745" class="arrow"/>
  <path d="M 925 420 H 940 V 370 H 955" class="arrow"/>
  <path d="M 925 455 H 940 V 515 H 955" class="arrow"/>

  <text x="942" y="356" class="small" text-anchor="middle">是</text>
  <text x="942" y="501" class="small" text-anchor="middle">否</text>
</svg>
