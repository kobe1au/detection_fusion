defaults:
  - ../seeds/seed_42.yaml

method:
  name: obfuscapk_code_eval

eval:
  eval_only: true
  output_name: obfuscapk_code_eval
  checkpoint_path: results/tri_modal_robust_new/final_seed_42/42/best_tri_modal_robust.pt
  refit_rejection_threshold: true
  run_test: false
  run_robust_test: false
  extra_sets:
    - name: obfuscapk_code
      pt_dir: ../../pts_obfuscapk/code
      csv: labels/obfuscapk_code.csv
      allow_pt_superset: true
      skip_if_empty: true
