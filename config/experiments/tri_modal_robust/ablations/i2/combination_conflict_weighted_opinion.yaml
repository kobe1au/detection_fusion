defaults:
  - ../../evidential_trusted_fusion.yaml

# This rule is active during Stage-1 and therefore defines a complete
# comparison method, not a post-hoc-only I2 ablation.
encoder_stage:
  protocol_id: fixed_evidential_rule_stage1_v1

method:
  name: fusion_rule_conflict_weighted_opinion
  protocol_id: fusion_rule_conflict_weighted_opinion_v1

train:
  exp_name: fusion_rule_conflict_weighted_opinion

fusion:
  # Custom certainty/conflict-weighted probability aggregation. This is a
  # complete fusion-rule comparison and is not labelled as ECML.
  combination: conflict_weighted_opinion
  routing:
    enabled: false
    # Equal one-scalar output calibration across all opinion-rule comparisons.
    final_temperature_scaling: true

# Fusion-rule cells compare forced classification only. I3 is evaluated
# separately on the frozen primary method.
selective_prediction:
  enabled: false
