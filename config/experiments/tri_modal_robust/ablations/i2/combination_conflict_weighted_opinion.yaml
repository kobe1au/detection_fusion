defaults:
  - ../../evidential_trusted_fusion.yaml

method:
  name: i2_combination_conflict_weighted_opinion
  protocol_id: i2_conflict_weighted_opinion_v1

train:
  exp_name: i2_combination_conflict_weighted_opinion

fusion:
  # Custom certainty/conflict-weighted probability aggregation. It remains an
  # internal I2 rule ablation and is not labelled as ECML.
  combination: conflict_weighted_opinion
  routing:
    enabled: false
    acceptance_score_mode: product
    # Equal one-scalar output calibration across all opinion-rule ablations.
    final_temperature_scaling: true
