defaults:
  - ../../evidential_trusted_fusion.yaml

method:
  name: i2_combination_cumulative

train:
  exp_name: i2_combination_cumulative

fusion:
  # Fair no-I2 control: retain evidential branch opinions and I1 trust
  # discounting, but replace the learned route/risk components with the
  # same fixed cumulative opinion-fusion rule for every sample.
  combination: cumulative
  routing:
    enabled: false
    acceptance_score_mode: product
    # Equal one-scalar output calibration across all opinion rules.
    final_temperature_scaling: true
