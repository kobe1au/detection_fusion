defaults:
  - ../../evidential_trusted_fusion.yaml

method:
  name: i2_router_prior_only
  protocol_id: odds_prior_beta1

train:
  exp_name: i2_router_prior_only

fusion:
  # Atomic pi ablation: replace only learned modality arbitration with the I1
  # reliability prior. This prior is explicitly odds(r)^1 (beta fixed at 1),
  # so it can become sharp near r=1; it is not a fitted soft-router ablation.
  # The independently fitted fused-risk head remains active.
  combination: routed
  routing:
    enabled: true
    mode: prior_only
    fixed_prior_beta: 1.0
    train_end_to_end: false
    posthoc_refine: true
    prediction_loss_weight: 0.0
    route_oracle_loss_weight: 0.0
    subset_oracle_loss_weight: 0.0
    subset_oracle_temperature: 1.0
    group_robust_objective:
      enabled: false
      soft_worst_weight: 0.0
    risk_mode: learned
    risk_loss_weight: 1.0
    final_temperature_scaling: true
