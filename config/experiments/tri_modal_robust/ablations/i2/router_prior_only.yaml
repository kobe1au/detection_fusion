defaults:
  - ../../evidential_trusted_fusion.yaml

method:
  name: i2_router_prior_only

train:
  exp_name: i2_router_prior_only

fusion:
  # Fair no-I2 control: keep I1, evidential opinions, the residual-error mass,
  # and final calibration, but replace learned arbitration with the exact
  # reliability-derived prior for every sample.
  combination: routed
  routing:
    enabled: true
    mode: prior_only
    train_end_to_end: false
    posthoc_refine: false
    use_fused_prediction_loss: false
    target_loss_weight: 0.0
    prediction_loss_weight: 0.0
    final_temperature_scaling: true

