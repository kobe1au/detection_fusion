defaults:
  - ../../evidential_trusted_fusion.yaml

# I1 OFF:
# Replace Dirichlet evidential opinion with softmax fixed-uncertainty pseudo opinion.
# Keep I2 Yager conflict-aware fusion and I3 conformal rejection.
method:
  name: module_no_i1_uncertainty_modeling

train:
  exp_name: module_no_i1_uncertainty_modeling

fusion:
  opinion_source: softmax_fixed_uncertainty
  softmax_opinion:
    uncertainty: 0.5
    temperature: 1.0

  combination: yager

  use_reliability_discount: true
  reliability_calibration:
    enabled: true
    use_relation_evidence: true
    use_evidential_uncertainty: false

loss:
  evidential_loss_weight: 0.0