defaults:
  - ../../observable_reliability_discount_fusion.yaml

method:
  name: module_reliability_only_discount_fusion

train:
  exp_name: module_reliability_only_discount_fusion

fusion:
  # Keep I1 reliability discount, but remove the relation/confidence/alive
  # factors introduced by the probability-level discount fusion mechanism.
  use_support_discount: false
  use_conflict_discount: false
  use_confidence_proxy: false
  use_hard_alive_mask: false


