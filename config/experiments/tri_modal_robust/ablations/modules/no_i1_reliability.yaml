defaults:
  - ../../evidential_trusted_fusion.yaml

# I1 OFF:
# Remove modality reliability estimation.
# Keep I2 evidential fusion and I3 conformal rejection as much as possible.
method:
  name: module_no_i1_reliability

train:
  exp_name: module_no_i1_reliability

fusion:
  # Disable reliability-based trust discounting.
  use_reliability_discount: false

  # Disable validation-fitted branch competence prior.
  branch_competence_prior:
    enabled: false

  # Disable clean-reference visible integrity modifier.
  visible_integrity_modifier:
    enabled: false

  # Disable monotonic reliability calibrator.
  reliability_calibration:
    enabled: false
    use_relation_evidence: false
    use_evidential_uncertainty: false

  # Evidential path does not need probability calibration.
  probability_calibration:
    enabled: false
    weight: 0.0

# No post-hoc calibration is needed once reliability calibration is removed.
calibration:
  enabled: false

loss:
  # Remove EDL reliability/uncertainty supervision.
  evidential_loss_weight: 0.0

  # Do not weight auxiliary branches by modality reliability.
  reliability_weighted_aux: false