defaults:
  - ../../evidential_trusted_fusion.yaml

method:
  name: module_no_i1_reliability

train:
  exp_name: module_no_i1_reliability

fusion:
  # Keep I2's global router, but remove every sample-level reliability input
  # supplied by I1. The class router therefore becomes conflict-only, while
  # the independent risk head retains boundary proximity and global
  # cross-modal conflict. No unidentifiable reliability coefficient remains
  # in either objective.
  combination: routed
  routing:
    enabled: true
  use_i1_reliability: false
  reliability_calibration:
    enabled: false

# Encoder supervision remains identical to the full method. This module
# ablation removes only the fitted I1 decision-time reliability pathway.
