defaults:
  - ../../evidential_trusted_fusion.yaml

method:
  name: module_no_reliability_discount

train:
  exp_name: module_no_reliability_discount

fusion:
  # Keep I2's global router, but remove every sample-level reliability input
  # supplied by I1. Its route residual still sees branch uncertainty and
  # availability; its risk head still sees the fixed structural-conflict term.
  combination: routed
  routing:
    enabled: true
  use_reliability_discount: false
  reliability_calibration:
    enabled: false

# Keep encoder supervision identical to the full method. Observable-integrity
# auxiliary weighting is evaluated separately as an atomic training mechanism;
# this module ablation removes only the I1 decision-time reliability pathway.
