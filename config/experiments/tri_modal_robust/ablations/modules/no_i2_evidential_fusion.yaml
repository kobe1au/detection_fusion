defaults:
  - ../../evidential_trusted_fusion.yaml

# I2 OFF:
# Replace subjective-logic/Yager evidential opinion fusion with
# reliability-weighted probability fusion.
#
# Keep I1 complete:
# observable evidence + relation evidence + EDL certainty are still used
# by the reliability calibrator. The EDL opinions are not fused; they only
# provide branch-level certainty features for reliability estimation.
method:
  name: module_no_i2_evidential_fusion

train:
  exp_name: module_no_i2_evidential_fusion

fusion:
  # No Yager / no subjective-logic opinion combination.
  combination: linear
  linear_use_joint_branch: false

  # Keep I1 reliability discount.
  use_reliability_discount: true

  # Avoid applying relation/conflict twice.
  # Relation evidence is already included in reliability_calibration.
  use_support_discount: false
  use_conflict_discount: false

  reliability_calibration:
    enabled: true
    use_relation_evidence: true
    use_evidential_uncertainty: false

  probability_calibration:
    enabled: false
    weight: 0.0

calibration:
  enabled: true

loss:
  evidential_loss_weight: 0.05