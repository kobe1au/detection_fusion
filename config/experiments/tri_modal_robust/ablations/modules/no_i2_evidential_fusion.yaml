defaults:
  - ../../evidential_trusted_fusion.yaml

# I2 OFF:
# Replace subjective-logic/Yager evidential fusion with legacy reliability-weighted
# probability fusion. Keep I1 reliability estimation and I3 conformal rejection.
method:
  name: module_no_i2_evidential_fusion

train:
  exp_name: module_no_i2_evidential_fusion

fusion:
  # Main switch: no Yager / no subjective-logic opinion combination.
  # The model falls back to linear reliability-discounted probability fusion.
  combination: linear

  # Keep reliability discount so I1 is still active.
  use_reliability_discount: true

  # Keep observable relation factors as part of reliability-aware discounting.
  use_support_discount: true
  use_conflict_discount: true

  # Important:
  # The current linear fusion path calls reliability_calibrator(evidence)
  # without passing evidential_certainty. Therefore this must be false,
  # otherwise MonotonicReliabilityCalibrator will raise an error.
  reliability_calibration:
    enabled: true
    use_relation_evidence: true
    use_evidential_uncertainty: false

  # Keep this aligned with the final method.
  probability_calibration:
    enabled: false
    weight: 0.0

# Keep post-hoc calibration because I1 reliability calibration is still used.
calibration:
  enabled: true

# Keep EDL branch supervision if you want branches to retain evidential training.
# However, the final fusion will not use subjective-logic combination.
loss:
  evidential_loss_weight: 0.1