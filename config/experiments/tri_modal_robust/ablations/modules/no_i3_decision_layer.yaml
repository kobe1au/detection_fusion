defaults:
  - ../../seeds/seed_42.yaml

method:
  name: module_no_i3_decision_layer

train:
  exp_name: module_no_i3_decision_layer

# Pure I3 removal: retain the exact same fitted macro-F1 classification
# operating point and disable only the selective accept/reject decision. The
# classification boundary is a shared protocol interface, not part of I3.
classification_threshold:
  enabled: true
  objective: macro_f1
  selection_rule: macro_f1_unconstrained_v1

selective_prediction:
  enabled: false

eval:
  eval_only: true
  output_name: module_no_i3_decision_layer
  checkpoint_path: results/tri_modal_robust/competence_anchored_seed_42/42/best_tri_modal_robust.pt
  refit_posthoc_calibration: false
  refit_decision_calibration: false
  run_test: true
  run_robust_test: true
