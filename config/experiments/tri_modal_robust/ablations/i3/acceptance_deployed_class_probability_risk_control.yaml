defaults:
  - ../../seeds/seed_42.yaml

method:
  name: i3_acceptance_deployed_class_probability_risk_control_eval

selective_prediction:
  # Keep the proposed CRC rule and alpha; replace only its ranking score.
  mode: risk_control
  threshold_score: deployed_class_probability

eval:
  eval_only: true
  output_name: i3_acceptance_deployed_class_probability_risk_control_eval
  checkpoint_path: results/tri_modal_robust/competence_anchored_seed_42/42/best_tri_modal_robust.pt
  refit_decision_calibration: true
  run_test: true
  run_robust_test: true
