defaults:
  - ../../seeds/seed_42.yaml

method:
  name: i3_predictive_entropy_threshold_eval

selective_prediction:
  mode: threshold
  # Larger-is-safer binary certainty: 1 - H(p) / log(2). In a binary task this
  # is a monotone transform of MSP and therefore only a ranking sanity check,
  # not an independent selective-prediction baseline.
  threshold_score: predictive_entropy_certainty
  target_coverage: 0.90

eval:
  eval_only: true
  output_name: i3_predictive_entropy_threshold_eval
  checkpoint_path: results/tri_modal_robust/evidential_seed_42/42/best_tri_modal_robust.pt
  refit_decision_calibration: true
  run_test: true
  run_robust_test: true
