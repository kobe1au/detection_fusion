defaults:
  - ../../seeds/seed_42.yaml

method:
  name: i3_mixture_certainty_threshold_eval

selective_prediction:
  mode: threshold
  threshold_score: mixture_certainty
  target_coverage: 0.90

eval:
  eval_only: true
  output_name: i3_mixture_certainty_threshold_eval
  checkpoint_path: results/tri_modal_robust/evidential_seed_42/42/best_tri_modal_robust.pt
  refit_decision_calibration: true
  run_test: true
  run_robust_test: true
