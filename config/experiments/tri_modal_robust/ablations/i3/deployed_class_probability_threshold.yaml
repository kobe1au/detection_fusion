defaults:
  - ../../seeds/seed_42.yaml

method:
  name: i3_deployed_class_probability_threshold_eval

selective_prediction:
  mode: threshold
  # Probability assigned to the class selected by the fitted deployment
  # threshold. This intentionally differs from strict MSP when the fitted
  # classification threshold is not 0.5.
  threshold_score: deployed_class_probability
  target_coverage: 0.90

eval:
  eval_only: true
  output_name: i3_deployed_class_probability_threshold_eval
  checkpoint_path: results/tri_modal_robust/competence_anchored_seed_42/42/best_tri_modal_robust.pt
  refit_decision_calibration: true
  run_test: true
  run_robust_test: true
