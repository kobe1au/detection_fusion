defaults:
  - ../../seeds/seed_42.yaml

method:
  name: i3_msp_threshold_eval

selective_prediction:
  mode: threshold
  # Strict binary maximum softmax probability: max(p, 1-p). It does not use
  # the separately fitted deployment classification threshold.
  threshold_score: msp
  target_coverage: 0.90

eval:
  eval_only: true
  output_name: i3_msp_threshold_eval
  checkpoint_path: results/tri_modal_robust/competence_anchored_seed_42/42/best_tri_modal_robust.pt
  refit_decision_calibration: true
  run_test: true
  run_robust_test: true
