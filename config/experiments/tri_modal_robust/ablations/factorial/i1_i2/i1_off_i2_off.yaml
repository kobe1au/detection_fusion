defaults:
  - ../../modules/no_i1_reliability.yaml

method:
  name: factorial_i1_off_i2_off

train:
  exp_name: factorial_i1_off_i2_off

fusion:
  combination: routed
  routing:
    enabled: true
    mode: prior_only
    posthoc_refine: false
    prediction_loss_weight: 0.0
    risk_mode: reliability_prior
    risk_target: threshold_malware_false_negative
    risk_loss_weight: 0.0
    final_temperature_scaling: true

# Both I1's sample-level reliability and I2's learned route/risk components are
# off. The route is uniform over alive branches and risk is the fixed reliability
# deficit; representation, final temperature, and I3 protocol remain fixed.
