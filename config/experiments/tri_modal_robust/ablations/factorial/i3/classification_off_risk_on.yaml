defaults:
  - ../../../seeds/seed_42.yaml

method:
  name: factorial_i3_classification_off_risk_on_eval

classification_threshold:
  # Use the protocol-neutral 0.5 malware boundary.
  enabled: false

selective_prediction:
  enabled: true
  mode: risk_control
  threshold_score: model_acceptance

eval:
  eval_only: true
  output_name: factorial_i3_classification_off_risk_on_eval
  checkpoint_path: results/tri_modal_robust/evidential_seed_42/42/best_tri_modal_robust.pt
  refit_rejection_threshold: true
  run_test: true
  run_robust_test: true

