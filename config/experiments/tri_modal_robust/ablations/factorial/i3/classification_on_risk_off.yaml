defaults:
  - ../../../seeds/seed_42.yaml

method:
  name: factorial_i3_classification_on_risk_off_eval

classification_threshold:
  enabled: true

selective_prediction:
  enabled: false

eval:
  eval_only: true
  output_name: factorial_i3_classification_on_risk_off_eval
  checkpoint_path: results/tri_modal_robust/evidential_seed_42/42/best_tri_modal_robust.pt
  # Refit the classification boundary on the same post-hoc subset even though
  # this cell has no rejection threshold.
  refit_rejection_threshold: true
  run_test: true
  run_robust_test: true

