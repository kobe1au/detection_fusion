defaults:
  - ../../evidential_trusted_fusion.yaml

method:
  name: i1_temperature_scaling_confidence_baseline
  protocol_id: i1_temperature_scaling_confidence_matched_v3

train:
  exp_name: i1_temperature_scaling_confidence_baseline

fusion:
  reliability_calibration:
    # Simple I1 comparator: one positive temperature per branch, fitted by
    # multiclass NLL, with r_m=max softmax(z_m/T_m). It does not consume the
    # proposed certainty/margin/class features. Use the same clean plus
    # branch-local partial-degradation identities as the proposed I1 so the
    # primary comparison changes the estimator rather than its data budget.
    enabled: true
    method: temperature_scaling_confidence
    temperature_fit_source: clean_plus_branch_local_partial
    initial_temperature: 1.0
    branches: [api, graph, manifest]
    use_evidential_certainty: false
    use_prediction_margin: false
    use_predicted_class_intercept: false
