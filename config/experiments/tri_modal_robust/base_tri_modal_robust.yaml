log_level: INFO

data:
  root: ""
  train_pt_dir: D:/pts_robust/train
  val_pt_dir: D:/pts_robust/val
  test_pt_dir: D:/pts_robust/test
  train_csv: labels/train.csv
  val_csv: labels/val.csv
  test_csv: labels/test.csv
  out_dir: results/tri_modal_robust

train:
  exp_name: base_tri_modal_robust
  seed: 42
  epochs: 60
  patience: 8
  batch_size: 48
  eval_batch_size: 64
  num_workers: 8
  eval_num_workers: 4
  lr: 0.0003

# I1: observable reliability estimation.
fusion:
  use_reliability_discount: true
  reliability_calibration:
    enabled: true
    hidden_dim: 16

  # I2: probability-level discount fusion.
  use_support_discount: true
  use_conflict_discount: true
  use_confidence_proxy: true
  use_hard_alive_mask: true
  support_factor:
    manifest_support_base: 0.5
    code_anchor_base: 0.5
  conflict_factor:
    min_value: 0.05

  # I3: selective decision score aggregation.
  acceptance_aggregation: product

loss:
  branch_aux_weight: 0.25
  reliability_weighted_aux: true

selective_prediction:
  enabled: true
  target_coverage: 0.95

robust:
  train_aug: true

eval:
  run_test: true
  run_robust_test: true
