defaults:
  - base_tri_modal_robust.yaml

method:
  name: observable_reliability_discount_fusion

train:
  exp_name: observable_reliability_discount_fusion

model:
  fusion_mode: discount_probability

semantic_reconstruction:
  enabled: true
  semantic_dim: 128
  mask_prob_api: 0.15
  mask_prob_graph: 0.15
  mask_prob_manifest: 0.15
  loss: bce
  weight: 0.02
  min_target_integrity: 0.2
  min_input_integrity: 0.2
  detach_reliability: true
  # Reconstruction is trained before post-hoc calibration.
  use_calibrated_reliability: false

fusion:
  mode: discount_probability
  detach_discount: true
  detach_confidence_proxy: true
  use_confidence_proxy: true
  use_conflict_discount: true
  use_hard_alive_mask: true
  acceptance_aggregation: min
  min_discount: 1.0e-6
  fallback: uniform
  confidence_proxy:
    type: entropy_margin
    temperature_api: 1.0
    temperature_graph: 1.0
    temperature_manifest: 1.0
    temperature_joint: 1.0
  reliability_calibration:
    enabled: true
    hidden_dim: 16
    # Unavailable relations provide no positive support to the calibrator.
    missing_relation_support: 0.0
    loss: bce
    weight: 1.0
  probability_calibration:
    enabled: true
    weight: 1.0
  support_factor:
    neutral_value: 0.5
    manifest_support_base: 0.5
    code_anchor_base: 0.5
  conflict_factor:
    min_value: 0.05

loss:
  branch_aux_weight: 0.05
  reliability_weighted_aux: true
  min_aux_weight: 0.2
  detach_reliability_for_aux: true
  # Reliability and temperature parameters are fitted after model selection
  # on validation data, not jointly with the representation encoders.
  reliability_calibration_weight: 0.0
  probability_calibration_weight: 0.0

calibration:
  enabled: true
  validation_fraction: 0.5
  split_seed: 42
  epochs: 5
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 5.0
  include_robust_val: true

selective_prediction:
  enabled: true
  target_coverage: 0.9
