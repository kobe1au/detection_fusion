defaults:
  - ../../base_tri_modal_robust.yaml

# Each trusted comparison trains its own declared evidential objective/rule.
encoder_stage:
  protocol_id: trusted_comparison_specific_stage1_v1

model:
  fusion_mode: discount_probability

fusion:
  mode: discount_probability
  use_i1_reliability: false
  use_hard_alive_mask: true
  reliability_calibration:
    enabled: false
calibration:
  enabled: false
  holdout_enabled: true
  role_assignment_path: labels/validation_roles_protocol_v1.json
  require_role_assignment: true

selective_prediction:
  enabled: false

loss:
  branch_aux_weight: 0.25
  auxiliary_weight_mode: unmasked_uniform
  evidential_loss_weight: 0.05
