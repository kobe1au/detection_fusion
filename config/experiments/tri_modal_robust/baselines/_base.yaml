defaults:
  - ../base_tri_modal_robust.yaml

# Baselines train their own active comparison head/fusion path in Stage-1;
# they must not be described as the main method's alive-uniform Stage-1.
encoder_stage:
  protocol_id: comparison_method_specific_stage1_v1

model:
  fusion_mode: tri_modal_concat

fusion:
  mode: model_dispatch
  use_i1_reliability: false
  use_hard_alive_mask: false
  reliability_calibration:
    enabled: false
calibration:
  enabled: false
  # Keep checkpoint selection on the same validation subset as the proposed
  # method even though these baselines do not fit post-hoc calibration.
  holdout_enabled: true
  role_assignment_path: labels/validation_roles_protocol_v1.json
  require_role_assignment: true

selective_prediction:
  enabled: false

loss:
  branch_aux_weight: 0.0
  auxiliary_weight_mode: unmasked_uniform
  evidential_loss_weight: 0.0
