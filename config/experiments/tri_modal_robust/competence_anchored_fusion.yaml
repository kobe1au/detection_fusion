defaults:
  - base_tri_modal_robust.yaml

method:
  name: competence_anchored_fusion
  protocol_id: tcp_joint_anchor_crc_v1

# Stage A learns one real Joint expert and three independently supervised
# atomic experts. Stage B never updates these encoders or expert heads.
encoder_stage:
  mode: fit
  protocol_id: joint_atomic_clean_stage1_v1
  checkpoint_path: null
  expected_sha256: null
  strict_identity: true

train:
  exp_name: competence_anchored_fusion

model:
  fusion_mode: anchored_joint_late

fusion:
  mode: model_dispatch
  competence:
    projection_dim: 32
    hidden_dim: 16
    dropout: 0.10
  anchored_router:
    initial_atomic_competence_scale: 1.0
    initial_joint_late_scale: 1.0
    initial_late_gate: 0.10

loss:
  objective: anchored_stage_a
  # Joint is the primary predictor. Atomic heads are deep supervision and the
  # missing-modality fallback, so they remain auxiliary rather than matching
  # the Joint objective one-for-one.
  atomic_aux_weight: 0.25
  auxiliary_weight_mode: alive_masked_uniform

# I1 and I2 are fitted only from train identities. Model-selection validation
# chooses Stage-A/Stage-B states and the ordinary classification threshold.
# The disjoint decision-calibration role is reserved exclusively for I3.
calibration:
  enabled: false
  validation_fraction: 0.25
  split_seed: 42
  stratified_group_split: true
  role_assignment_path: labels/validation_roles_protocol_v2.json
  require_role_assignment: true

stage_b:
  enabled: true
  validation_perturb_strength: 0.5
  degradation:
    mechanisms:
      - api_event_dropout
      - graph_sparsify
      - manifest_permission_mask
    strength_min: 0.1
    strength_max: 0.9
  competence:
    epochs: 30
    patience: 6
    lr: 0.001
    weight_decay: 0.0001
    regression: mse
    degraded_loss_weight: 0.25
    # First keep epochs whose clean TCP loss is within 1% of the best clean
    # epoch; only inside that clean-safe band use degraded mean/worst loss.
    clean_noninferiority_relative_tolerance: 0.01
    clean_noninferiority_absolute_tolerance: 0.0
    ranking_weight: 0.10
    ranking_tie_tolerance: 0.02
    grad_clip: 5.0
  router:
    epochs: 40
    patience: 8
    lr: 0.005
    weight_decay: 0.0001
    grad_clip: 5.0
    degradation_loss_weights: [0.0, 0.1, 0.25, 0.5]
    clean_anchor_kl_weight: 0.10
    clean_noninferiority_tolerance: 0.0
    degraded_source_noninferiority_tolerance: 0.0
    minimum_robust_gain: 0.0

classification_threshold:
  enabled: true
  objective: macro_f1
  selection_rule: macro_f1_unconstrained_v1

selective_prediction:
  enabled: true
  mode: risk_control
  threshold_score: malware_fn_probability_anchor
  risk_target: accepted_fn_risk_among_malware
  risk_level: 0.05
  min_calibration_malware: 100
  require_feasible: true
