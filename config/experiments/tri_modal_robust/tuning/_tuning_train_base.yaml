defaults:
  - ../observable_reliability_discount_fusion.yaml

train:
  exp_name: tuning_base
  tuning_mode: true
  epochs: 35
  patience: 5
  # Select the same clean-validation checkpoint used by formal experiments.
  # Full robust validation runs once after the best checkpoint is restored.
  checkpoint_metric: clean_macro_f1

eval:
  run_test: false
  run_robust_test: false
  robust_val:
    enabled: true
