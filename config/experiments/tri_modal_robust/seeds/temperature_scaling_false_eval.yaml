defaults:
  - ../evidential_trusted_fusion.yaml

method:
  name: temperature_scaling_false_eval
eval:
  checkpoint_path: results/tri_modal_robust/evidential_seed_42/42/best_tri_modal_robust.pt
  eval_only: true
  refit_posthoc_calibration: false
  # Keep the checkpoint architecture and fitted router unchanged, but replace
  # its fitted scalar temperature with the identity transform T=1.
  final_temperature_override: 1.0
  # The temperature override changes the probability scale. Remap the saved
  # raw-log-odds class cutoff and refit the I3 decision artifact on its original
  # calibration split; the underlying binary class partition stays fixed.
  refit_decision_calibration: true

train:
  exp_name: temperature_scaling_false_eval
  seed: 42
