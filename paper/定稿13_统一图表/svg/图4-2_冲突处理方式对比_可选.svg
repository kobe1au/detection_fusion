<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="3.5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L9,3.5 L0,7 Z" fill="#333333"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="70" y="215" width="260" height="150" rx="8" fill="#F4F4F4" stroke="#333333" stroke-width="2"/>
<text x="200.0" y="280.62" text-anchor="middle" font-family="SimSun, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" fill="#111111">多模态证据</text>
<text x="200.0" y="318.42" text-anchor="middle" font-family="SimSun, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="400" fill="#111111">共同支持与冲突</text>
<line x1="330" y1="290" x2="455" y2="290" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="470" y="115" width="330" height="150" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
<text x="635.0" y="180.62" text-anchor="middle" font-family="SimSun, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" fill="#111111">Dempster规则</text>
<text x="635.0" y="218.42000000000002" text-anchor="middle" font-family="SimSun, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="400" fill="#111111">归一化非冲突证据</text>
<rect x="470" y="355" width="330" height="150" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
<text x="635.0" y="420.62" text-anchor="middle" font-family="SimSun, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" fill="#111111">Yager规则</text>
<text x="635.0" y="458.42" text-anchor="middle" font-family="SimSun, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="400" fill="#111111">冲突计入不确定性</text>
<polyline points="400,290 400,190 460,190" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="400,290 400,430 460,430" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="920" y="115" width="330" height="150" rx="8" fill="#F4F4F4" stroke="#333333" stroke-width="2"/>
<text x="1085.0" y="180.62" text-anchor="middle" font-family="SimSun, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" fill="#111111">类别支持增强</text>
<text x="1085.0" y="218.42000000000002" text-anchor="middle" font-family="SimSun, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="400" fill="#111111">冲突影响被弱化</text>
<rect x="920" y="355" width="330" height="150" rx="8" fill="#F4F4F4" stroke="#333333" stroke-width="2"/>
<text x="1085.0" y="420.62" text-anchor="middle" font-family="SimSun, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" fill="#111111">不确定性提高</text>
<text x="1085.0" y="458.42" text-anchor="middle" font-family="SimSun, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="400" fill="#111111">保留模态分歧</text>
<line x1="800" y1="190" x2="910" y2="190" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="800" y1="430" x2="910" y2="430" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="1360" y="355" width="180" height="150" rx="8" fill="#EDEDED" stroke="#333333" stroke-width="2"/>
<text x="1450.0" y="420.62" text-anchor="middle" font-family="SimSun, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" fill="#111111">本文采用</text>
<text x="1450.0" y="458.42" text-anchor="middle" font-family="SimSun, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="400" fill="#111111">Yager规则</text>
<line x1="1250" y1="430" x2="1350" y2="430" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>