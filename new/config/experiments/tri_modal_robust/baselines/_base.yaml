defaults:
  - ../base_tri_modal_robust.yaml

# Baselines train their own active comparison head/fusion path in Stage-1;
# they must not be described as the main method's alive-uniform Stage-1.
encoder_stage:
  protocol_id: comparison_method_specific_stage1_v1

model:
  fusion_mode: tri_modal_concat

fusion:
  mode: model_dispatch
  use_hard_alive_mask: false
calibration:
  # Match CARE Stage A: fit on a deterministic group-disjoint 90% train
  # subset and select the checkpoint on the remaining 10%.
  expert_val_fraction: 0.10
  expert_split_seed: 4242
  # The immutable validation roles are audit-only for baselines.
  role_assignment_path: labels/validation_roles_protocol_v3.json
  require_role_assignment: true

# CARE and every baseline use the same unfitted argmax/0.5 classifier.
classification_threshold:
  enabled: false

loss:
  branch_aux_weight: 0.0
  auxiliary_weight_mode: unmasked_uniform
  evidential_loss_weight: 0.0
