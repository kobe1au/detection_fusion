data:
  # The curated CSVs define the three splits. Keeping one PT pool avoids
  # physically duplicating/moving tensors whenever the split is regenerated.
  train_pt_dir: /root/autodl-tmp/pts_all
  val_pt_dir: /root/autodl-tmp/pts_all
  test_pt_dir: /root/autodl-tmp/pts_all
  train_csv: labels/train.csv
  val_csv: labels/val.csv
  test_csv: labels/test.csv
  out_dir: results/tri_modal_robust

train:
  device: auto
  num_workers: 8
  eval_num_workers: 8
  # Avoid exhausting file descriptors when PyG batches contain many tensors.
  multiprocessing_sharing_strategy: file_system
  prefetch_factor: 1
