# Canonical formal train/validation/test PT build for observable-v2.
# Update only the machine-specific APK directories when moving environments.

data:
  splits: [train, val, test]
  split_dirs:
    train: E:/train
    val: E:/val
    test: E:/test
  out_root: D:/pts_robust

hyperparameters:
  vocab_size: 256

graph:
  sensitive_hops: 1
  max_methods_per_dex: 4096
  fallback_max_methods: 512
  fallback_policy: api_rich
  # Extraction keeps the four lightweight hints in the 519-D PT schema.
  # The formal model drops them before its 515-D graph encoder so that API
  # behavior is not copied into the Graph branch.
  use_behavior_hints: true

api:
  num_hash_buckets: 8192
  max_events_per_dex: 2048
  max_events_per_method: 32
  event_scope: all_methods
  framework_only: true
  include_descriptor: false

manifest:
  # This is the train-only vocabulary used by formal and external PT builds.
  vocab_path: D:/code/detection_fusion_copy/config/manifest_vocab.yaml
  rebuild_vocab: false
  allow_empty_vocab: false
  manifest_dim: 256
  max_permissions: 128
  max_intents: 64
  max_features: 32
  save_manifest_jsonl: true
  manifest_jsonl_dir: D:/pts_robust/_manifest_jsonl

storage:
  keep_method_names: false
  keep_api_tokens: false

# Audited one-step lineage for the 6:2:2 -> frozen-test 7:1:2 Manifest-only
# migration. This does not weaken formal training: after --apply every PT must
# carry the new fingerprint, and the stat-bound audit certificate verifies it.
# The digest was independently re-derived from the previous train-only vocab
# and this file's code-side extraction configuration.
migration:
  allowed_previous_build_fingerprints:
    - 7825ef23db92b98a7055b72275317f045e234d305f1d5803a063e4b0edbf25da

execution:
  # Existing observable-v1 PTs fail the schema/fingerprint check and are
  # rebuilt automatically; matching observable-v2 files are reused.
  resume: true
  allow_empty_splits: false
  fail_on_error: false
  workers: 8
  failed_json: D:/pts_robust/failed_tri_modal_direct.json
